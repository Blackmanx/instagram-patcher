name: Patch Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight UTC

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch Latest Piko Patches Version
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/crimera/piko/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if Release Exists
        id: check_release
        run: |
          if gh release view ${{ steps.version.outputs.tag }} > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists. Skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Patcher
        if: steps.check_release.outputs.exists == 'false'
        run: |
          chmod +x patch.sh
          ./patch.sh

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Instagram Patched - Piko ${{ steps.version.outputs.tag }}
          files: instagram-patched.apk
          body: |
            Automatically patched Instagram APK.
            Using Piko Patches: ${{ steps.version.outputs.tag }}
            All default Piko patches applied.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
